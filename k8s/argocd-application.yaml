# applied by hand once: kubectl apply -f k8s/argocd-application.yaml. after that argo cd keeps k8s/ in sync with main
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flight-pricing-analyzer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pbonard/flight-pricing-analyzer.git
    targetRevision: main
    # the collectors' cronjobs and configmaps, managed in its values.yaml
    path: k8s/helm
    helm:
      releaseName: flight-collector
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
